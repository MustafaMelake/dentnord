# Weekly dependency updates (pnpm-lock.yaml). Security updates arrive as soon as an advisory is
# published, independent of this schedule (enable "Dependabot security updates" in the repo settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 10
    groups:
      # Patch and minor bumps land as one PR; majors stay separate so each gets its own review.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
